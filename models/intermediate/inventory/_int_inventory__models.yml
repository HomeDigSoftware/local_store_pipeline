version: 2

models:
  - name: int_inventory__current_stock
    description: "Canonical inventory model that exposes one trusted current stock view per product."
    columns:
      - name: item_id
        description: "Product identifier."
        data_tests:
          - not_null
          - unique
      - name: item_name
        description: "Readable product name from the staged item master."
      - name: current_inventory_qty
        description: "Current trusted stock quantity for the product."
      - name: counted_inventory_qty
        description: "Counted inventory quantity when available."
      - name: inventory_gap_qty
        description: "Difference between counted inventory and system inventory balance when a count exists."
      - name: inventory_value_cost
        description: "Inventory value at unit cost based on the trusted current quantity."
      - name: inventory_value_retail
        description: "Inventory value at sale price based on the trusted current quantity."

  - name: int_inventory__stock_health
    description: "Inventory health classification model used to identify stock risk, overstock, and dead stock."
    columns:
      - name: item_id
        description: "Product identifier."
        data_tests:
          - not_null
          - unique
      - name: stock_status
        description: "Business classification of stock health."
        data_tests:
          - accepted_values:
              values: [HEALTHY, OUT_OF_STOCK, STOCKOUT_RISK, OVERSTOCK, DEAD_STOCK]
      - name: current_inventory_qty
        description: "Current stock quantity used in the health calculation."
      - name: days_of_cover_30d
        description: "Inventory coverage in days based on recent sales velocity."
      - name: velocity_band
        description: "Sales movement label carried forward from the product velocity model."
        data_tests:
          - accepted_values:
              values: [FAST, STEADY, SLOW, NO_RECENT_SALES, OUT_OF_STOCK]

  - name: int_inventory__product_velocity
    description: "Product velocity model that measures sales speed against available inventory."
    columns:
      - name: item_id
        description: "Product identifier."
        data_tests:
          - not_null
          - unique
      - name: current_inventory_qty
        description: "Current inventory quantity used in the velocity calculation."
      - name: sold_qty_7d
        description: "Units sold over the last 7 days."
      - name: sold_qty_30d
        description: "Units sold over the last 30 days."
      - name: avg_daily_sales_30d
        description: "Average daily units sold over the last 30 days."
      - name: sales_inventory_ratio_30d
        description: "Ratio between recent sales and current inventory."
      - name: days_of_cover_30d
        description: "Estimated number of days the current stock will cover at the recent sales pace."
      - name: velocity_band
        description: "Business label for the product movement speed."
        data_tests:
          - accepted_values:
              values: [FAST, STEADY, SLOW, NO_RECENT_SALES, OUT_OF_STOCK]
