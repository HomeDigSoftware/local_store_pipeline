version: 2

models:
  - name: int_workforce__attendance_events_clean
    description: "Cleaned attendance event model that standardizes punch records before shift pairing."
    columns:
      - name: employee_id
        description: "Employee identifier."
        data_tests:
          - not_null
      - name: attendance_date
        description: "Attendance event date."
      - name: attendance_datetime
        description: "Standardized attendance event timestamp."
        data_tests:
          - not_null
      - name: movement_type
        description: "Normalized attendance movement type."
      - name: action_type
        description: "Normalized event direction as IN, OUT, or UNKNOWN."
      - name: is_manual_correction
        description: "Flag indicating the event came from a manual correction code."

  - name: int_workforce__shifts
    description: "Workforce shift model that pairs cleaned attendance in and out events into shift sessions."
    columns:
      - name: employee_id
        description: "Employee identifier."
        data_tests:
          - not_null
      - name: shift_date
        description: "Date attributed to the shift."
        data_tests:
          - not_null
      - name: shift_start_time
        description: "Start time of the shift."
      - name: shift_end_time
        description: "End time of the shift."
      - name: shift_duration_minutes
        description: "Duration of the shift in minutes."
      - name: shift_duration_hours
        description: "Duration of the shift in hours."

  - name: int_workforce__daily_employee_hours
    description: "Daily employee hours aggregation derived from cleaned shift sessions."
    columns:
      - name: shift_date
        description: "Date of the employee hours aggregation."
        data_tests:
          - not_null
      - name: employee_id
        description: "Employee identifier."
        data_tests:
          - not_null
      - name: total_shift_minutes
        description: "Total worked time in minutes for the employee on the day."
      - name: total_shift_hours
        description: "Total hours worked by the employee on the day."
      - name: shift_count
        description: "Number of shifts attributed to the employee on the day."

  - name: int_workforce__daily_sales_attribution
    description: "Daily workforce attribution model that allocates store sales to employees based on their share of worked hours on the same day."
    columns:
      - name: shift_date
        description: "Date of the attribution record."
        data_tests:
          - not_null
      - name: employee_id
        description: "Employee identifier receiving the attributed sales share."
        data_tests:
          - not_null
      - name: total_shift_minutes
        description: "Total worked time in minutes for the employee on the day."
      - name: total_shift_hours
        description: "Total worked time in hours for the employee on the day."
      - name: store_sales_amount
        description: "Total store sales amount on the same day before attribution."
      - name: labor_share_ratio
        description: "Employee share of worked hours out of all worked hours on the same day."
      - name: attributed_sales_amount
        description: "Store sales allocated to the employee using the labor share ratio."
      - name: sales_per_hour
        description: "Attributed sales divided by the employee hours worked on the day."
