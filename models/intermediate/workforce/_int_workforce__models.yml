version: 2

models:
  - name: int_workforce__attendance_events_clean
    description: "Cleaned attendance event model that standardizes punch records before shift pairing."
    columns:
      - name: employee_id
        description: "Employee identifier."
        data_tests:
          - not_null
      - name: attendance_date
        description: "Attendance event date."
      - name: attendance_datetime
        description: "Standardized attendance event timestamp."
        data_tests:
          - not_null
      - name: movement_type
        description: "Normalized attendance movement type."
      - name: action_type
        description: "Normalized event direction as IN, OUT, or UNKNOWN."
        data_tests:
          - accepted_values:
              arguments:
                values: [IN, OUT, UNKNOWN]
      - name: is_manual_correction
        description: "Flag indicating the event came from a manual correction code."

  - name: int_workforce__shifts
    description: "Workforce shift model that pairs cleaned attendance in and out events into shift sessions."
    columns:
      - name: employee_id
        description: "Employee identifier."
        data_tests:
          - not_null
      - name: shift_date
        description: "Date attributed to the shift."
        data_tests:
          - not_null
      - name: shift_start_time
        description: "Start time of the shift."
      - name: shift_end_time
        description: "End time of the shift."
      - name: shift_duration_minutes
        description: "Duration of the shift in minutes."
      - name: shift_duration_hours
        description: "Duration of the shift in hours."
        data_tests:
          # The synthetic attendance generator hard-caps every shift at 12h, so any
          # shift longer than that is a real integrity violation (a missing/duplicated
          # punch) — enforced as error. (The old static .bak employees, including the
          # one ~529h missing-clock-out shift, were purged on 2026-06-24.)
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 12
              config:
                severity: error

  - name: int_workforce__daily_employee_hours
    description: "Daily employee hours aggregation derived from cleaned shift sessions."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - shift_date
              - employee_id
    columns:
      - name: shift_date
        description: "Date of the employee hours aggregation."
        data_tests:
          - not_null
      - name: employee_id
        description: "Employee identifier."
        data_tests:
          - not_null
      - name: total_shift_minutes
        description: "Total worked time in minutes for the employee on the day."
      - name: total_shift_hours
        description: "Total hours worked by the employee on the day."
      - name: shift_count
        description: "Number of shifts attributed to the employee on the day."

  - name: int_workforce__daily_sales_attribution
    description: "Daily workforce attribution model that allocates store sales to employees based on their share of worked hours on the same day."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - shift_date
              - employee_id
    columns:
      - name: shift_date
        description: "Date of the attribution record."
        data_tests:
          - not_null
      - name: employee_id
        description: "Employee identifier receiving the attributed sales share."
        data_tests:
          - not_null
      - name: total_shift_minutes
        description: "Total worked time in minutes for the employee on the day."
      - name: total_shift_hours
        description: "Total worked time in hours for the employee on the day."
      - name: store_sales_amount
        description: "Total store sales amount on the same day before attribution."
      - name: labor_share_ratio
        description: "Employee share of worked hours out of all worked hours on the same day."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
      - name: attributed_sales_amount
        description: "Store sales allocated to the employee using the labor share ratio."
      - name: sales_per_hour
        description: "Attributed sales divided by the employee hours worked on the day."

  - name: int_workforce__shift_pay
    description: >
      Per-shift payroll. Splits each shift's worked hours into Israeli-style
      overtime tiers (1-8h x1.0, 9-10h x1.25, 11-12h x1.5, hard-capped at 12h)
      and prices them against the per-employee hourly rate from the
      employee_wages seed. total_pay = regular_pay + ot125_pay + ot150_pay.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - shift_date
              - employee_id
    columns:
      - name: employee_id
        description: "Employee identifier."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_employee')
                field: employee_id
      - name: shift_date
        description: "Date attributed to the shift."
        data_tests:
          - not_null
      - name: shift_duration_hours
        description: "Duration of the shift in hours (<= 12 by construction)."
      - name: hourly_rate
        description: "Base hourly wage for the employee, joined from the employee_wages seed."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 1000
      - name: regular_hours
        description: "Hours paid at x1.0 (the first 8 hours of the shift)."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 8
      - name: ot125_hours
        description: "Hours paid at x1.25 (hours 9-10)."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 2
      - name: ot150_hours
        description: "Hours paid at x1.5 (hours 11-12)."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 2
      - name: regular_pay
        description: "regular_hours * hourly_rate."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: ot125_pay
        description: "ot125_hours * hourly_rate * 1.25."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: ot150_pay
        description: "ot150_hours * hourly_rate * 1.5."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: total_pay
        description: "Total shift pay = regular_pay + ot125_pay + ot150_pay."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
