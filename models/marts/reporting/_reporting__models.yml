version: 2

models:
  - name: rpt_daily_sales
    description: "Daily sales reporting model built from the downstream sales intermediate layer for monitoring and dashboard delivery."
    columns:
      - name: sale_date
        description: "Date of the report grain."
        data_tests:
          - not_null
          - unique
      - name: total_sales_amount
        description: "Total sales amount for the day."
      - name: total_units_sold
        description: "Total units sold for the day."
      - name: ticket_count
        description: "Number of transactions for the day."
      - name: avg_ticket_amount
        description: "Average sales amount per transaction for the day."

  - name: rpt_product_velocity
    description: "Product velocity reporting model for stock coverage and movement analysis built from the inventory snapshot fact."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - snapshot_date
            - item_id
    columns:
      - name: snapshot_date
        description: "Date of the inventory snapshot used for the report row."
        data_tests:
          - not_null
      - name: item_id
        description: "Product identifier."
        data_tests:
          - not_null
      - name: current_inventory_qty
        description: "Current inventory quantity used in the report."
      - name: sold_qty_7d
        description: "Units sold over the last 7 days."
      - name: sold_qty_30d
        description: "Units sold over the last 30 days."
      - name: days_of_cover_30d
        description: "Estimated days of stock coverage based on recent velocity."
      - name: velocity_band
        description: "Movement speed classification for the product."
        data_tests:
          - accepted_values:
              values: [FAST, STEADY, SLOW, NO_RECENT_SALES, OUT_OF_STOCK]

  - name: rpt_inventory_risk
    description: "Inventory exception report that highlights stockout risk, overstock, and dead stock from the inventory snapshot fact."
    columns:
      - name: snapshot_date
        description: "Date of the inventory snapshot used for the report row."
        data_tests:
          - not_null
      - name: item_id
        description: "Product identifier."
        data_tests:
          - not_null
      - name: stock_status
        description: "Inventory risk classification."
        data_tests:
          - accepted_values:
              values: [HEALTHY, OUT_OF_STOCK, STOCKOUT_RISK, OVERSTOCK, DEAD_STOCK]
      - name: current_inventory_qty
        description: "Current inventory quantity."
      - name: days_of_cover_30d
        description: "Inventory coverage in days based on recent sales."
      - name: velocity_band
        description: "Movement speed classification carried into the risk report."

  - name: rpt_employee_productivity
    description: "Workforce productivity report that exposes daily worked time per employee and populates sales productivity using hour-share attribution at the daily store level."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - shift_date
            - employee_id
    columns:
      - name: employee_id
        description: "Employee identifier."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_employee')
              field: employee_id
      - name: shift_date
        description: "Date of the productivity record."
        data_tests:
          - not_null
      - name: employee_name
        description: "Readable employee name from the employee dimension."
      - name: total_shift_minutes
        description: "Total worked time in minutes for the employee on the day."
      - name: hours_worked
        description: "Hours worked by the employee on the day."
      - name: shift_count
        description: "Number of shifts attributed to the employee on the day."
      - name: sales_amount
        description: "Attributed sales amount allocated to the employee from daily store sales."
      - name: sales_per_hour
        description: "Attributed sales divided by hours worked on the day."

  - name: rpt_inventory_actions
    description: "Inventory action report that translates stock risk and velocity metrics into replenishment and cleanup recommendations."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - snapshot_date
            - item_id
    columns:
      - name: snapshot_date
        description: "Snapshot date used for the inventory action row."
        data_tests:
          - not_null
      - name: item_id
        description: "Product identifier."
        data_tests:
          - not_null
      - name: stock_status
        description: "Resolved stock status including healthy items."
        data_tests:
          - accepted_values:
              values: [HEALTHY, OUT_OF_STOCK, STOCKOUT_RISK, OVERSTOCK, DEAD_STOCK]
      - name: reorder_flag
        description: "Flag indicating the item should be reordered soon or immediately."
        data_tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: overstock_flag
        description: "Flag indicating the item is overstocked."
        data_tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: dead_stock_flag
        description: "Flag indicating the item is a dead-stock candidate."
        data_tests:
          - accepted_values:
              values: [true, false]
              quote: false
      - name: action_priority
        description: "Priority ranking of the recommended action (1 = most urgent reorder .. 5 = no action)."
        data_tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
      - name: recommended_action
        description: "Suggested next action for the item."
        data_tests:
          - accepted_values:
              values:
                - 'Reorder immediately'
                - 'Reorder soon'
                - 'Review markdown or promotion'
                - 'Reduce purchasing and monitor sell-through'
                - 'No action needed'

  - name: rpt_product_performance_30d
    description: "Thirty-day product performance report combining sales, estimated gross profit, and inventory efficiency metrics."
    columns:
      - name: item_id
        description: "Product identifier."
        data_tests:
          - not_null
          - unique
      - name: stock_status
        description: "Current stock status carried from the inventory action model."
        data_tests:
          - accepted_values:
              values: [HEALTHY, OUT_OF_STOCK, STOCKOUT_RISK, OVERSTOCK, DEAD_STOCK]
      - name: sales_amount_30d
        description: "Net sales amount over the last 30 days."
      - name: units_sold_30d
        description: "Units sold over the last 30 days."
      - name: estimated_gross_profit_30d
        description: "Estimated gross profit over the last 30 days using current profit per unit."
      - name: current_inventory_qty
        description: "Current on-hand inventory quantity."

  - name: rpt_executive_summary_daily
    description: "Daily executive summary that combines store sales with snapshot-based inventory risk counts."
    columns:
      - name: sale_date
        description: "Date of the summary row."
        data_tests:
          - not_null
          - unique
      - name: total_sales_amount
        description: "Total sales amount for the day."
      - name: out_of_stock_count
        description: "Count of products out of stock on the snapshot date matching the day."
      - name: stockout_risk_count
        description: "Count of products with stockout risk on the snapshot date matching the day."
      - name: avg_days_of_cover_30d
        description: "Average days of cover across inventory items for the snapshot date matching the day."

  - name: rpt_sales_trend_daily
    description: "Daily sales trend report with calendar attributes and period-over-period comparisons."
    columns:
      - name: sale_date
        description: "Date of the trend row."
        data_tests:
          - not_null
          - unique
      - name: day_of_week_name
        description: "Readable day of week name."
      - name: total_sales_amount
        description: "Total sales amount for the day."
      - name: sales_prev_day
        description: "Sales amount from the previous day."
      - name: sales_prev_week_same_day
        description: "Sales amount from the same weekday in the prior week."
      - name: sales_7d_avg
        description: "Rolling seven-day average sales amount."

  - name: rpt_payment_mix_daily
    description: "Daily payment method breakdown showing revenue and ticket share per payment type. Grain is one row per receipt_date, payment_type, and is_credit (the same payment_type may appear with both credit flags on a day)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - receipt_date
            - payment_type
            - is_credit
    columns:
      - name: receipt_date
        description: "Date of the payment record."
        data_tests:
          - not_null
      - name: payment_type
        description: "Payment method code."
        data_tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3]
              config:
                severity: warn
      - name: is_credit
        description: "Flag indicating credit-based payment."
      - name: sales_amount
        description: "Total sales amount for the date and payment type."
      - name: ticket_count
        description: "Number of distinct transactions for the date and payment type."
      - name: units_sold
        description: "Total units sold for the date and payment type."
      - name: payment_sales_share
        description: "Percentage share of daily revenue attributed to this payment type."
      - name: payment_ticket_share
        description: "Percentage share of daily transactions attributed to this payment type."

  - name: rpt_returns_analysis_daily
    description: "Daily return analysis by product showing return quantities, amounts, and ticket counts."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - receipt_date
            - item_id
    columns:
      - name: receipt_date
        description: "Date of the return."
        data_tests:
          - not_null
      - name: item_id
        description: "Product identifier."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: item_id
      - name: item_name
        description: "Product name."
      - name: product_category_id
        description: "Product category identifier."
      - name: product_category_name
        description: "Product category name."
      - name: return_qty
        description: "Total units returned (positive value)."
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: return_amount
        description: "Total return value in ILS (positive value)."
      - name: return_ticket_count
        description: "Number of distinct return transactions."

  - name: rpt_sales_by_hour
    description: "Hourly sales breakdown by date showing revenue, ticket count, and units sold per hour."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - receipt_date
            - sales_hour
    columns:
      - name: receipt_date
        description: "Date of the sales record."
        data_tests:
          - not_null
      - name: sales_hour
        description: "Hour of the day (0-23)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 23
      - name: day_of_week_name
        description: "Readable day of week name."
      - name: sales_amount
        description: "Total sales amount for the hour, NET of returns (returns carry a negative net_sales_amount and are summed in, consistent with rpt_daily_sales)."
      - name: ticket_count
        description: "Number of distinct transactions in the hour."
      - name: units_sold
        description: "Total units sold in the hour."
      - name: avg_ticket_amount
        description: "Average basket value for the hour."

  - name: rpt_inventory_health_trend
    description: "Inventory-health trend over the accumulated snapshot history. Grain is one row per snapshot_date (business day), with per-status item counts, total on-hand units, average days of cover, plus a rolling 7-day at-risk average and week-over-week delta. Depth grows as the backfill loop accumulates more days; only meaningful when built via the day-by-day loop."
    columns:
      - name: snapshot_date
        description: "Business date of the inventory snapshot (one row per day)."
        data_tests:
          - not_null
          - unique
      - name: items_count
        description: "Total products in the snapshot for the day."
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: out_of_stock_count
        description: "Products out of stock on the day."
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: stockout_risk_count
        description: "Products at stockout risk on the day."
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: dead_stock_count
        description: "Dead-stock products on the day."
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: overstock_count
        description: "Overstocked products on the day."
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: healthy_count
        description: "Healthy-stock products on the day."
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: at_risk_count
        description: "Products out of stock or at stockout risk (needs attention now)."
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: total_inventory_units
        description: "Total on-hand inventory units across all products for the day."
      - name: avg_days_of_cover_30d
        description: "Average days of stock coverage across products for the day."
      - name: at_risk_7d_avg
        description: "Rolling seven-day average of the at-risk product count."
      - name: at_risk_wow_delta
        description: "Week-over-week change in at-risk count (lag 7 days; null until 7 days exist)."

  - name: rpt_category_performance_30d
    description: "Thirty-day category performance report aggregating product sales, estimated profit, and inventory risk by category."
    columns:
      - name: product_category_id
        description: "Product category identifier."
        data_tests:
          - not_null
          - unique
      - name: product_category_name
        description: "Product category name."
      - name: sales_amount_30d
        description: "Total net sales amount over the last 30 days for the category."
      - name: units_sold_30d
        description: "Total units sold over the last 30 days for the category."
      - name: ticket_count_30d
        description: "Total transactions over the last 30 days for the category."
      - name: estimated_gross_profit_30d
        description: "Estimated gross profit over the last 30 days for the category."
      - name: avg_days_of_cover_30d
        description: "Average days of stock coverage across products in the category."
      - name: out_of_stock_count
        description: "Number of products out of stock in the category."
      - name: stockout_risk_count
        description: "Number of products at stockout risk in the category."
      - name: dead_stock_count
        description: "Number of dead stock products in the category."
      - name: overstock_count
        description: "Number of overstocked products in the category."
      - name: category_sales_rank_30d
        description: "Rank of the category by 30-day sales amount."
      - name: category_profit_rank_30d
        description: "Rank of the category by 30-day estimated gross profit."
