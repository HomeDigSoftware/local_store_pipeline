version: 2

models:
  - name: rpt_daily_sales
    description: "Daily sales reporting model built from the downstream sales intermediate layer for monitoring and dashboard delivery."
    columns:
      - name: sale_date
        description: "Date of the report grain."
        data_tests:
          - not_null
      - name: total_sales_amount
        description: "Total sales amount for the day."
      - name: total_units_sold
        description: "Total units sold for the day."
      - name: ticket_count
        description: "Number of transactions for the day."
      - name: avg_ticket_amount
        description: "Average sales amount per transaction for the day."

  - name: rpt_product_velocity
    description: "Product velocity reporting model for stock coverage and movement analysis built from the inventory snapshot fact."
    columns:
      - name: snapshot_date
        description: "Date of the inventory snapshot used for the report row."
        data_tests:
          - not_null
      - name: item_id
        description: "Product identifier."
        data_tests:
          - not_null
      - name: current_inventory_qty
        description: "Current inventory quantity used in the report."
      - name: sold_qty_7d
        description: "Units sold over the last 7 days."
      - name: sold_qty_30d
        description: "Units sold over the last 30 days."
      - name: days_of_cover_30d
        description: "Estimated days of stock coverage based on recent velocity."
      - name: velocity_band
        description: "Movement speed classification for the product."

  - name: rpt_inventory_risk
    description: "Inventory exception report that highlights stockout risk, overstock, and dead stock from the inventory snapshot fact."
    columns:
      - name: snapshot_date
        description: "Date of the inventory snapshot used for the report row."
        data_tests:
          - not_null
      - name: item_id
        description: "Product identifier."
        data_tests:
          - not_null
      - name: stock_status
        description: "Inventory risk classification."
      - name: current_inventory_qty
        description: "Current inventory quantity."
      - name: days_of_cover_30d
        description: "Inventory coverage in days based on recent sales."
      - name: velocity_band
        description: "Movement speed classification carried into the risk report."

  - name: rpt_employee_productivity
    description: "Workforce productivity report that exposes daily worked time per employee and populates sales productivity using hour-share attribution at the daily store level."
    columns:
      - name: employee_id
        description: "Employee identifier."
        data_tests:
          - not_null
      - name: shift_date
        description: "Date of the productivity record."
        data_tests:
          - not_null
      - name: employee_name
        description: "Readable employee name from the employee dimension."
      - name: total_shift_minutes
        description: "Total worked time in minutes for the employee on the day."
      - name: hours_worked
        description: "Hours worked by the employee on the day."
      - name: shift_count
        description: "Number of shifts attributed to the employee on the day."
      - name: sales_amount
        description: "Attributed sales amount allocated to the employee from daily store sales."
      - name: sales_per_hour
        description: "Attributed sales divided by hours worked on the day."

  - name: rpt_inventory_actions
    description: "Inventory action report that translates stock risk and velocity metrics into replenishment and cleanup recommendations."
    columns:
      - name: snapshot_date
        description: "Snapshot date used for the inventory action row."
        data_tests:
          - not_null
      - name: item_id
        description: "Product identifier."
        data_tests:
          - not_null
      - name: stock_status
        description: "Resolved stock status including healthy items."
      - name: reorder_flag
        description: "Flag indicating the item should be reordered soon or immediately."
      - name: action_priority
        description: "Priority ranking of the recommended action."
      - name: recommended_action
        description: "Suggested next action for the item."

  - name: rpt_product_performance_30d
    description: "Thirty-day product performance report combining sales, estimated gross profit, and inventory efficiency metrics."
    columns:
      - name: item_id
        description: "Product identifier."
        data_tests:
          - not_null
          - unique
      - name: sales_amount_30d
        description: "Net sales amount over the last 30 days."
      - name: units_sold_30d
        description: "Units sold over the last 30 days."
      - name: estimated_gross_profit_30d
        description: "Estimated gross profit over the last 30 days using current profit per unit."
      - name: current_inventory_qty
        description: "Current on-hand inventory quantity."
      - name: stock_status
        description: "Current stock status carried from the inventory action model."

  - name: rpt_executive_summary_daily
    description: "Daily executive summary that combines store sales with snapshot-based inventory risk counts."
    columns:
      - name: sale_date
        description: "Date of the summary row."
        data_tests:
          - not_null
          - unique
      - name: total_sales_amount
        description: "Total sales amount for the day."
      - name: out_of_stock_count
        description: "Count of products out of stock on the snapshot date matching the day."
      - name: stockout_risk_count
        description: "Count of products with stockout risk on the snapshot date matching the day."
      - name: avg_days_of_cover_30d
        description: "Average days of cover across inventory items for the snapshot date matching the day."

  - name: rpt_sales_trend_daily
    description: "Daily sales trend report with calendar attributes and period-over-period comparisons."
    columns:
      - name: sale_date
        description: "Date of the trend row."
        data_tests:
          - not_null
          - unique
      - name: day_of_week_name
        description: "Readable day of week name."
      - name: total_sales_amount
        description: "Total sales amount for the day."
      - name: sales_prev_day
        description: "Sales amount from the previous day."
      - name: sales_prev_week_same_day
        description: "Sales amount from the same weekday in the prior week."
      - name: sales_7d_avg
        description: "Rolling seven-day average sales amount."
