<?xml version="1.0" encoding="UTF-8"?>
<!--
  ============================================================================
  Store Analytics Pipeline — "Sources → Engine → Output" diagram (Variation 3)
  ============================================================================
  DESIGN-AGENT NOTES
  • All colors are declared once in the <style> block below as CSS custom
    properties (CSS variables). Change them in ONE place to re-skin the whole
    diagram. Variable names describe ROLE, not hue, so re-theming is safe.
  • Fonts: uses generic stacks (system-ui / monospace). Swap the
    ==font-display / ==font-mono values to match the project's type system.
  • Canvas is 1200 x 520. Scales cleanly to any width. For a PNG export at
    2x, render at 2400 x 1040.
  • Dark/light: edit ==bg, ==surface, ==ink, ==ink-soft. A ready light theme
    is provided commented-out at the bottom of the <style> block.
  ============================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="var(--font-display)" role="img" aria-label="Data pipeline: three sources flow into an EL to T engine, then out to a dashboard">
  <style>
    :root{
      /* ---- THEME (edit these) ---------------------------------------- */
      --bg:           #0e141b;   /* page / canvas background            */
      --surface:      #18222d;   /* cards, engine body                  */
      --surface-2:    #20303d;   /* inner chips inside the engine       */
      --stroke:       #2c3a48;   /* hairline borders                    */
      --ink:          #eef4f9;   /* primary text                        */
      --ink-soft:     #8da0b0;   /* secondary / labels                  */

      --accent-extract:  #ff8a3d; /* stage 1 — Extract (amber)          */
      --accent-load:     #ff6849; /* stage 2 — Load (orange-red)        */
      --accent-transform:#ef5b6b; /* stage 3 — Transform (dbt red)      */
      --accent-serve:    #3ecf8e; /* output / Supabase (green)          */
      --flow:            #3ecf8e; /* the flowing arrows                 */

      --font-display: "Inter","Segoe UI",system-ui,sans-serif;
      --font-mono:    "JetBrains Mono","SF Mono",ui-monospace,monospace;
      /* ----------------------------------------------------------------- */
    }
    .bg     { fill: var(--bg); }
    .card   { fill: var(--surface); stroke: var(--stroke); stroke-width:1.5; }
    .chip   { fill: var(--surface-2); stroke: var(--stroke); stroke-width:1; }
    .ink    { fill: var(--ink); }
    .soft   { fill: var(--ink-soft); }
    .title  { font-weight:800; }
    .mono   { font-family: var(--font-mono); }
    .src-ic { font-size:22px; }
    .flow-line { stroke: var(--flow); stroke-width:3.5; fill:none; stroke-linecap:round; }
    .flow-dash { stroke: var(--flow); stroke-width:3.5; fill:none;
                 stroke-dasharray:2 9; stroke-linecap:round; opacity:.55; }

    /* clickable hit-areas (links wrap these in the README integration) */
    .hit { fill: transparent; cursor: pointer; }
    a:hover .card, a:focus .card { stroke: var(--flow); stroke-width:2.5; }
    a:hover .engine-body { stroke: var(--flow); }

    /* ===== READY LIGHT THEME — uncomment to use =======================
    :root{
      --bg:#f5f7fa; --surface:#ffffff; --surface-2:#f0f4f8; --stroke:#dde4ec;
      --ink:#16202b; --ink-soft:#5a6b7b;
    }
    ================================================================== */
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="520" rx="0"/>

  <!-- ============================ TITLE ============================ -->
  <text class="ink title" x="60" y="64" font-size="30">Store Analytics Pipeline</text>
  <text class="soft mono" x="61" y="92" font-size="14" letter-spacing="2">EL → T  ·  POS to live dashboard, refreshed nightly</text>

  <!-- ====================== STAGE LABELS (top) ===================== -->
  <text class="mono" x="175"  y="150" font-size="12" letter-spacing="3" fill="var(--accent-extract)" text-anchor="middle">SOURCES</text>
  <text class="mono" x="600"  y="150" font-size="12" letter-spacing="3" fill="var(--accent-transform)" text-anchor="middle">EL → T ENGINE</text>
  <text class="mono" x="1035" y="150" font-size="12" letter-spacing="3" fill="var(--accent-serve)" text-anchor="middle">OUTPUT</text>

  <!-- ========================= SOURCES ============================ -->
  <!-- source 1 -->
  <g>
    <rect class="card" x="60" y="185" width="230" height="56" rx="14"/>
    <rect class="chip" x="74" y="199" width="28" height="28" rx="8"/>
    <text class="src-ic" x="88" y="220" text-anchor="middle">🗄️</text>
    <text class="ink title" x="116" y="210" font-size="15">Verifone POS</text>
    <text class="soft mono" x="116" y="228" font-size="11">real .bak backup</text>
  </g>
  <!-- source 2 -->
  <g>
    <rect class="card" x="60" y="252" width="230" height="56" rx="14"/>
    <rect class="chip" x="74" y="266" width="28" height="28" rx="8"/>
    <text class="src-ic" x="88" y="287" text-anchor="middle">🧪</text>
    <text class="ink title" x="116" y="277" font-size="15">Synthetic sales</text>
    <text class="soft mono" x="116" y="295" font-size="11">Option C variance</text>
  </g>
  <!-- source 3 -->
  <g>
    <rect class="card" x="60" y="319" width="230" height="56" rx="14"/>
    <rect class="chip" x="74" y="333" width="28" height="28" rx="8"/>
    <text class="src-ic" x="88" y="354" text-anchor="middle">📦</text>
    <text class="ink title" x="116" y="344" font-size="15">Inventory cycle</text>
    <text class="soft mono" x="116" y="362" font-size="11">replenish ~6d</text>
  </g>

  <!-- ============== FLOW: sources → engine (converging) ============ -->
  <path class="flow-line" d="M298 213 C 360 213, 360 280, 420 280"/>
  <path class="flow-line" d="M298 280 L 420 280"/>
  <path class="flow-line" d="M298 347 C 360 347, 360 280, 420 280"/>
  <!-- arrowhead into engine -->
  <path d="M414 272 L 432 280 L 414 288 Z" fill="var(--flow)"/>

  <!-- ============================ ENGINE ========================== -->
  <rect class="card engine-body" x="440" y="180" width="320" height="200" rx="22"/>
  <text class="ink title" x="600" y="214" font-size="16" text-anchor="middle">EL → T engine</text>

  <!-- three rings: Extract / Load / Transform -->
  <g>
    <rect class="chip" x="462" y="238" width="86" height="110" rx="14"/>
    <text x="505" y="284" text-anchor="middle" font-size="26">🐍</text>
    <text class="ink title" x="505" y="316" text-anchor="middle" font-size="13">Extract</text>
    <text class="soft mono" x="505" y="333" text-anchor="middle" font-size="10">Python</text>
  </g>
  <g>
    <rect class="chip" x="557" y="238" width="86" height="110" rx="14"/>
    <text x="600" y="284" text-anchor="middle" font-size="26">🐘</text>
    <text class="ink title" x="600" y="316" text-anchor="middle" font-size="13">Load</text>
    <text class="soft mono" x="600" y="333" text-anchor="middle" font-size="10">Postgres</text>
  </g>
  <g>
    <rect class="chip" x="652" y="238" width="86" height="110" rx="14"/>
    <text x="695" y="284" text-anchor="middle" font-size="26">⚙️</text>
    <text class="ink title" x="695" y="316" text-anchor="middle" font-size="13">Transform</text>
    <text class="soft mono" x="695" y="333" text-anchor="middle" font-size="10">dbt</text>
  </g>
  <!-- tiny internal arrows between rings -->
  <path d="M548 293 L 557 293" class="flow-line" stroke-width="2.5"/>
  <path d="M643 293 L 652 293" class="flow-line" stroke-width="2.5"/>

  <!-- ============== FLOW: engine → output ========================= -->
  <path class="flow-dash" d="M760 280 L 905 280"/>
  <path d="M900 272 L 918 280 L 900 288 Z" fill="var(--flow)"/>

  <!-- ============================ OUTPUT ========================== -->
  <g>
    <rect x="930" y="222" width="210" height="116" rx="20" fill="var(--accent-serve)"/>
    <text x="1035" y="285" text-anchor="middle" font-size="40">📊</text>
    <text x="1035" y="316" text-anchor="middle" font-size="14" font-weight="800" fill="#06281c">Next.js dashboard</text>
  </g>
  <text class="soft mono" x="1035" y="360" text-anchor="middle" font-size="11">on Vercel · ISR</text>

  <!-- ===================== STORAGE / AUTOMATION strip ============= -->
  <rect class="chip" x="60" y="430" width="1080" height="46" rx="14"/>
  <text class="soft mono" x="84" y="458" font-size="12">
    <tspan fill="var(--accent-serve)">⬡ Supabase</tspan> store_pipeline · 13 rpt_ tables   ·   39 dbt models · 179 tests · 0 errors   ·   <tspan fill="var(--flow)">⏱ nightly @ 03:00</tspan> → load → dbt run --target prod → revalidate webhook
  </text>

  <!-- ===================== CLICKABLE HIT AREAS ====================
       In the README, the design agent (or you) wraps each <a> around the
       matching hit-rect, pointing href to the #anchor of its <details>.
       Example: <a href="#sources"> ... </a>
       These are kept transparent so they don't alter the visual. -->
  <!-- <a href="#sources"><rect class="hit" x="60"  y="185" width="230" height="190"/></a> -->
  <!-- <a href="#engine"><rect class="hit"  x="440" y="180" width="320" height="200"/></a> -->
  <!-- <a href="#output"><rect class="hit"  x="930" y="222" width="210" height="116"/></a> -->
</svg>
