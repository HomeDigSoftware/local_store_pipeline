name: dbt CI

# WHEN this pipeline runs:
on:
  pull_request:            # every Pull Request
  push:
    branches: [ main ]     # every push that lands on main
  workflow_dispatch:       # a manual "Run workflow" button in the Actions tab

jobs:
  # ---------------------------------------------------------------------------
  # GATE: the project must build AND pass its tests. A small raw fixture
  # (ci/fixture/seed_raw.sql) seeds all 8 source tables into a disposable
  # Postgres, then we validate code (parse/compile) AND run every model,
  # snapshot and data test via `dbt build`. The real .bak can't live in CI, so
  # this fixture stands in for it.
  # ---------------------------------------------------------------------------
  dbt-validate:
    name: dbt build & test
    runs-on: ubuntu-latest

    # A throwaway Postgres for the job; dbt connects to it at localhost:5432.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store_local
        ports:
          - 5432:5432
        # Wait until Postgres is actually accepting connections before dbt runs.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/ci   # use ci/profiles.yml

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create the virtual environment
        run: uv venv --python 3.12

      - name: Install CI dependencies (dbt-postgres)
        run: uv pip install -r requirements-ci.txt

      # Load the full raw fixture (all 8 source tables) BEFORE dbt runs. The
      # date-spine macro runs `min(recordingdate) FROM raw.documents` at COMPILE
      # time (run_query), and `dbt build` below then runs+tests every model, so
      # the raw data must exist first. The fixture is guarded (ci.fixture_ok)
      # because it drops raw.* — see ci/fixture/seed_raw.sql.
      - name: Load the raw CI fixture (all 8 source tables)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d store_local \
            -v ON_ERROR_STOP=1 \
            -c "SET ci.fixture_ok = '1';" \
            -f ci/fixture/seed_raw.sql

      - name: Install dbt packages (dbt_utils, dbt_expectations)
        run: uv run dbt deps

      - name: Validate the project (refs, sources, YAML, DAG)
        run: uv run dbt parse --no-partial-parse

      - name: Compile every model to SQL
        run: uv run dbt compile

      # THE INTEGRATION GATE: build every model + snapshot and run every data
      # test against the fixture. This is what turns CI from "it compiles" into
      # "it runs and the tests pass". A failing test fails the PR.
      - name: Build all models and run all data tests (against the fixture)
        run: uv run dbt build

  # ---------------------------------------------------------------------------
  # NON-BLOCKING: style linting. Runs only if the gate passed. continue-on-error
  # means findings are reported but never fail the workflow or block a merge.
  # ---------------------------------------------------------------------------
  sql-lint:
    name: sqlfluff lint (non-blocking)
    runs-on: ubuntu-latest
    needs: dbt-validate
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/ci

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create the virtual environment
        run: uv venv --python 3.12

      - name: Install dbt + sqlfluff
        run: uv pip install -r requirements-ci.txt sqlfluff sqlfluff-templater-dbt

      # sqlfluff's dbt templater compiles models too, so it hits the same
      # compile-time date-spine query — load the same guarded raw fixture.
      - name: Load the raw CI fixture (all 8 source tables)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d store_local \
            -v ON_ERROR_STOP=1 \
            -c "SET ci.fixture_ok = '1';" \
            -f ci/fixture/seed_raw.sql

      - name: Install dbt packages
        run: uv run dbt deps

      # Informational only: print findings to the log but always exit 0, so a
      # never-linted codebase's style findings never show as a red ❌. Drop the
      # `|| true` later once the findings are cleaned up to enforce style.
      - name: Lint models with sqlfluff (informational — never blocks the build)
        run: uv run sqlfluff lint models || true
